name: Build DarkMora Admin APK

on:
  push:
    branches: [ main ]
    paths:
      - 'admin-app/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

jobs:
  build-admin:
    name: Build DarkMora Admin Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Admin Keystore
        env:
          KS_B64: ${{ secrets.DARKMORA_ADMIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > admin-app/app/darkmora-admin.jks
          fi

      - name: Build Admin Release APK
        working-directory: admin-app
        env:
          DARKMORA_STORE_FILE: darkmora-admin.jks
          DARKMORA_STORE_PASSWORD: ${{ secrets.DARKMORA_STORE_PASSWORD }}
          DARKMORA_KEY_ALIAS: ${{ secrets.DARKMORA_KEY_ALIAS }}
          DARKMORA_KEY_PASSWORD: ${{ secrets.DARKMORA_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMora-Admin-APK
          path: admin-app/app/build/outputs/apk/release/*.apk
