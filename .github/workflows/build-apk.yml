name: Build DarkMora Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build DarkMora Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore
        if: ${{ secrets.DARKMORA_RELEASE_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.DARKMORA_RELEASE_KEYSTORE_B64 }}" | base64 -d > app/darkmora-release.jks

      - name: Build Release APK
        env:
          DARKMORA_STORE_FILE: darkmora-release.jks
          DARKMORA_STORE_PASSWORD: ${{ secrets.DARKMORA_STORE_PASSWORD }}
          DARKMORA_KEY_ALIAS: ${{ secrets.DARKMORA_KEY_ALIAS }}
          DARKMORA_KEY_PASSWORD: ${{ secrets.DARKMORA_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMora-Native-APK
          path: app/build/outputs/apk/release/app-release.apk
