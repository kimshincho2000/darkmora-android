name: Build DarkMora Go Streamer

on:
  push:
    branches: [ main ]
    paths:
      - 'stream-go/**'
      - '.github/workflows/build-stream-go.yml'
  workflow_dispatch:

jobs:
  build-go:
    name: Build DarkMora Go Streamer (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Tidy and Build Linux amd64 Binary
        working-directory: stream-go
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go mod tidy
          go build -trimpath -ldflags="-s -w" -o stream_go_bin .
          ls -lh stream_go_bin

      - name: Upload Go Streamer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMora-Stream-Go
          path: stream-go/stream_go_bin
